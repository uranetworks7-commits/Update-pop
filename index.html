<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Back - URA SV-10</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    /* RESET & BACKGROUND */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #0f172a 0%, #000000 100%);
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    /* Subtle animated background grid */
    body::before {
        content: "";
        position: absolute;
        width: 200%;
        height: 200%;
        background-image: 
            linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        transform: rotate(45deg);
        z-index: -1;
    }

    .popup-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        perspective: 1000px;
    }
    
    /* THE MAIN POPUP CARD */
    .popup {
      position: relative;
      /* INCREASED SIZE AND PADDING */
      padding: 80px 40px; 
      text-align: center;
      border-radius: 35px; 
      color: #e0f7fa;
      
      /* Bigger Width */
      width: 90%; 
      max-width: 550px; 
      
      /* Glassmorphism Background */
      background: rgba(10, 20, 35, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      
      /* THE BIG GREEN/CYAN LINE (NEON BORDER) */
      border: 3px solid #00f2ff;
      box-shadow: 
        0 0 50px rgba(0, 242, 255, 0.25), 
        inset 0 0 40px rgba(0, 242, 255, 0.1);
      
      animation: floatIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    /* Inner glow border for depth */
    .popup::after {
        content: "";
        position: absolute;
        inset: 8px;
        border: 1px solid rgba(0, 242, 255, 0.15);
        border-radius: 28px;
        pointer-events: none;
    }

    /* ICON STYLING */
    .icon-box {
        width: 110px; /* Slightly bigger icon container */
        height: 110px;
        margin: 0 auto 35px auto;
        background: linear-gradient(135deg, rgba(0, 242, 255, 0.15), rgba(0, 0, 0, 0));
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 2px solid rgba(0, 242, 255, 0.4);
        box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
        animation: pulse 3s infinite;
    }

    .icon-svg {
        width: 60px;
        height: 60px;
        fill: #00f2ff;
        filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.9));
    }

    /* TYPOGRAPHY */
    .popup h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem; /* Bigger Font */
      margin: 0 0 20px 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      
      /* Gradient Text */
      background: linear-gradient(90deg, #fff, #00f2ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(0, 242, 255, 0.4);
    }

    .popup p {
      font-size: 1.2rem; /* Bigger Text */
      line-height: 1.8; 
      color: #b3e5fc;
      margin-bottom: 10px; /* Reduced bottom margin since button is gone */
      font-weight: 300;
    }

    .highlight {
        color: #ffd700;
        font-weight: 600;
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }

    /* ANIMATIONS */
    @keyframes floatIn {
      0% { transform: translateY(50px) scale(0.9); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0.4); }
        70% { box-shadow: 0 0 0 20px rgba(0, 242, 255, 0); }
        100% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0); }
    }
  </style>
</head>
<body>

  <div class="popup-container">
    <div class="popup">
      
      <!-- Stylish SVG Icon Container -->
      <div class="icon-box">
        <svg class="icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
        </svg>
      </div>
      
      <h1>Welcome Back</h1>
      
      <p>
       Explore more advanced features <br>and earn exclusive <span class="highlight">Rewards</span>.
      </p>
      
      <!-- Removed Button and PR Team Signature -->

    </div>
  </div>

</body>
</html>
